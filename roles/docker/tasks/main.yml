---
- name: Install prerequisite packages
  become: true
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  tags: [docker, setup]

- name: Add Docker GPG key
  become: true
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: [docker, setup]

- name: Add Docker repository
  become: true
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  tags: [docker, setup]

- name: Install Docker Engine and Compose plugin
  become: true
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: [docker, install]

- name: Ensure Docker service is running
  become: true
  service:
    name: docker
    state: started
    enabled: true
  tags: [docker, service]

- name: Add vagrant user to docker group
  become: true
  user:
    name: vagrant
    groups: docker
    append: true
  tags: [docker, setup]

- name: Create custom Docker network for app containers
  become: true
  docker_network:
    name: "{{ docker_network_name }}"
    state: present
  tags: [docker, network]
